<body data-pagina="contribuir">
<main id="conteudo">
  <section class="page-head"><div class="container estreito">
    <h1>Dízimos, Ofertas e Primícias</h1>
  </div></section>
  <section class="secao" style="padding-top:8px"><div class="container estreito">
    <div class="card pix-card">
      <h2 class="pix-titulo"><i data-icon="qr"></i>Pix</h2>
      <div id="pix-aviso"></div>
      <div class="pix-layout">
        <div class="pix-acoes pilha">
          <button class="btn bloco grande" id="copiar-codigo"><i data-icon="copiar"></i><span>Copiar código Pix</span></button>
          <ol class="pix-passos pequeno">
            <li>Toque em <b>Copiar código Pix</b>.</li>
            <li>No app do seu banco, escolha <b>Pix copia e cola</b>.</li>
            <li>Cole o código, digite o valor e confirme.</li>
          </ol>
          <span class="rotulo">Ou use a chave Pix</span>
          <div class="pix-chave"><code id="pix-chave"></code><button class="btn secundario" id="copiar-chave" aria-label="Copiar chave Pix"><i data-icon="copiar"></i><span>Copiar</span></button></div>
          <p class="pequeno">Titular: <b id="pix-titular"></b></p>
        </div>
        <div class="pix-qr-bloco">
          <div class="qr" id="pix-qr" role="img" aria-label="QR code do Pix"></div>
          <p class="pequeno muted">Está no computador? Aponte a câmera do app do banco para o QR code.</p>
        </div>
      </div>
    </div>
  </div></section>
</main>
<script type="module" src="js/core/layout.js"></script>
<script type="module" src="js/paginas/contribuir.js"></script>
</body>
