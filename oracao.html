<body data-pagina="oracao">
<main id="conteudo">
  <section class="page-head"><div class="container estreito">
    <p class="eyebrow">Oração</p>
    <h1>Precisa de oração?</h1>
    <p>Você não está sozinho. Conte para nós o que está no seu coração. Nossa equipe de intercessão vai orar por você.</p>
  </div></section>
  <section class="secao" style="padding-top:8px"><div class="container estreito">
    <div class="card" id="area-oracao">
      <form class="form" id="form-oracao" novalidate>
        <div class="campo"><label for="pedido">Seu pedido *</label><textarea id="pedido" name="pedido" required maxlength="3000" placeholder="Escreva aqui…"></textarea></div>
        <label class="check"><input type="checkbox" name="anonimo" id="anonimo"><span><b>Enviar anonimamente</b><br><small>Não guardaremos seu nome, contato nem sua conta.</small></span></label>
        <div id="dados-pessoais" class="pilha">
          <div class="campo"><label for="nome">Seu nome <span class="muted">(opcional)</span></label><input id="nome" name="nome" type="text" maxlength="100" autocomplete="name"></div>
          <div class="campo"><label for="contato">Celular ou e-mail para retorno <span class="muted">(opcional)</span></label><input id="contato" name="contato" type="text" maxlength="120"></div>
        </div>
        <label class="check"><input type="checkbox" name="publico"><span>Pode compartilhar com a equipe de intercessores (sem expor detalhes publicamente).</span></label>
        <div class="msg" role="alert" aria-live="assertive"></div>
        <button class="btn bloco" type="submit"><i data-icon="oracao"></i>Enviar pedido</button>
        <p class="pequeno">Ao enviar, você concorda com a nossa <a class="link-sutil" href="privacidade.html">política de privacidade</a>.</p>
        <p class="aviso-recaptcha pequeno muted">Protegido pelo reCAPTCHA: valem a <a href="https://policies.google.com/privacy?hl=pt-BR" target="_blank" rel="noopener">Política de Privacidade</a> e os <a href="https://policies.google.com/terms?hl=pt-BR" target="_blank" rel="noopener">Termos de Serviço</a> do Google.</p>
      </form>
    </div>
  </div></section>
</main>
