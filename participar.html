<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Participar — IDPB Jave Sabaoth</title>
<meta name="description" content="Células, voluntariado e batismo: escolha seu próximo passo.">
<meta name="theme-color" content="#F0C749">
<meta property="og:title" content="Participar — IDPB Jave Sabaoth">
<meta property="og:description" content="Células, voluntariado e batismo: escolha seu próximo passo.">
<meta property="og:image" content="assets/img/icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="participar">
<main id="conteudo">
  <section class="page-head"><div class="container">
    <p class="eyebrow">Próximo passo</p>
    <h1>Participar</h1>
    <p>Igreja é família. Escolha por onde quer começar. O formulário é o mesmo e leva menos de um minuto.</p>
  </div></section>
  <section class="secao" style="padding-top:8px"><div class="container">
    <div class="grid grid-3" role="tablist" aria-label="Escolha uma opção" id="opcoes">
      <button class="card link" role="tab" data-tipo="grupo" style="text-align:left;cursor:pointer;font:inherit">
        <div class="icone-card verde"><i data-icon="grupo"></i></div><h3>Células e grupos</h3><p class="muted">Encontros semanais nas casas para estudar a Bíblia, orar e fazer amigos.</p></button>
      <button class="card link" role="tab" data-tipo="voluntariado" style="text-align:left;cursor:pointer;font:inherit">
        <div class="icone-card verde"><i data-icon="maoAmiga"></i></div><h3>Voluntariado</h3><p class="muted">Louvor, recepção, mídia, infantil… Há um lugar para você servir.</p></button>
      <button class="card link" role="tab" data-tipo="batismo" style="text-align:left;cursor:pointer;font:inherit">
        <div class="icone-card verde"><i data-icon="agua"></i></div><h3>Batismo</h3><p class="muted">Deu o passo de seguir Jesus? Inscreva-se na próxima turma de batismo.</p></button>
    </div>
    <div class="container estreito" style="padding:0;margin-top:24px"><div class="card" id="form-participar" tabindex="-1"></div></div>
  </div></section>
</main>
<script type="module" src="js/core/layout.js"></script>
<script type="module">
  import { montarFormulario } from "./js/core/forms.js";
  const alvo = document.getElementById("form-participar");
  const botoes = [...document.querySelectorAll("#opcoes [data-tipo]")];
  function escolher(tipo, foco) {
    botoes.forEach(b => { b.setAttribute("aria-selected", b.dataset.tipo === tipo); b.style.borderColor = b.dataset.tipo === tipo ? "var(--ouro-escuro)" : ""; b.style.boxShadow = b.dataset.tipo === tipo ? "0 0 0 3px var(--ouro)" : ""; });
    montarFormulario(alvo, tipo);
    history.replaceState(null, "", "#" + tipo);
    if (foco) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  botoes.forEach(b => b.addEventListener("click", () => escolher(b.dataset.tipo, true)));
  const inicial = location.hash.slice(1);
  escolher(["grupo","voluntariado","batismo"].includes(inicial) ? inicial : "grupo", !!inicial);
</script>
</body>
</html>
